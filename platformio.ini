; PlatformIO project (works on macOS). Arduino IDE users: open firmware/smart_irrigation/smart_irrigation.ino instead.
[platformio]
src_dir = firmware/smart_irrigation

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
